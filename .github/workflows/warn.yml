name: warn

on:
  schedule:
    # Every 3 hours (feed.toml check_every_hours), off the top of the hour when
    # Actions is busiest. Note: if this workflow is disabled and re-enabled, push a
    # change to this file, or GitHub may not register the schedule again.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    uses: ./.github/workflows/_run-feed.yml
    with:
      feed: warn
      account: ALEX
    secrets: inherit
