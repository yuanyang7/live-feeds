name: warn

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours (feed.toml check_every_hours); off the top of the hour, when Actions is busiest
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    uses: ./.github/workflows/_run-feed.yml
    with:
      feed: warn
      account: ALEX
    secrets: inherit
