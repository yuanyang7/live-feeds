name: warn

on:
  schedule:
    # Hourly (feed.toml check_every_hours), off the top of the hour when Actions is
    # busiest. Scheduled runs on shared runners start late and get dropped outright,
    # so asking for every hour is what keeps the real cadence close to a few hours.
    # Note: if this workflow is disabled and re-enabled, push a change to this file,
    # or GitHub may not register the schedule again.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    uses: ./.github/workflows/_run-feed.yml
    with:
      feed: warn
      account: ALEX
    secrets: inherit
