name: warn

on:
  # No cron here on purpose: Actions' scheduled runs on shared runners start up to
  # an hour late and get dropped outright. scripts/local_timer.py keeps the feed on
  # its check_every_hours cadence from a laptop; this is the manual escape hatch.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    uses: ./.github/workflows/_run-feed.yml
    with:
      feed: warn
      account: ALEX
    secrets: inherit
